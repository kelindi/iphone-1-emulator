name: CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native emulator
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build WebAssembly emulator
        run: |
          emcmake cmake -S . -B web/build -DIPHONE1_WEB=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build web/build
      - name: Run WebAssembly smoke test
        run: node web/smoke.mjs
